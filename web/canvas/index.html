<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padrão — canvas</title>
<link rel="stylesheet" href="canvas.css">
</head>
<body data-page="canvas">

  <!-- grade infinita (fica no fundo e acompanha a câmera via JS) -->
  <div id="grid"></div>
  <div id="vignette"></div>

  <!-- mundo: o espaço infinito onde janelas, notas e mídias vivem -->
  <div id="world">
    <div id="origin" title="origem do mundo (0,0)"></div>
    <div id="wins"></div>   <!-- etiquetas/contornos das janelas reais -->
    <div id="items"></div>  <!-- notas, imagens e vídeos do canvas -->
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="chip" id="zoom-chip">100%</div>
    <div class="chip ghost" id="hint">
      arraste o fundo para navegar · Ctrl+rolar = zoom · botão direito = menu
    </div>
  </div>

  <!-- menu de contexto -->
  <div id="ctx" class="menu" hidden></div>

  <!-- notificações -->
  <div id="toasts"></div>

  <script src="../shared/bridge.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
