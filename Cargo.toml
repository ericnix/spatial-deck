[workspace]
resolver = "2"
members = ["common", "compositor", "frontend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Spatial Deck"]
repository = "https://github.com/ericnix/spatial-deck"

[workspace.dependencies]
anyhow = "1"
common = { path = "common" }
futures-util = { version = "0.3", features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
